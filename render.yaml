# One-click deploy on Render: New > Blueprint > pick this repo.
# FREE plans: the web service sleeps after 15 min idle (~1 min wake-up) and the free
# Postgres expires 30 days after creation (14-day grace, then deleted, no backups).
# Fine for demos; move both to paid plans before real users.
services:
  - type: web
    name: vegnutri
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    # Migrations run at start-up because free instances don't support preDeployCommand
    startCommand: flask --app wsgi db upgrade && gunicorn -c gunicorn.conf.py wsgi:app
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: vegnutri-db
          property: connectionString
      - key: APP_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TASK_TOKEN
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
databases:
  - name: vegnutri-db
    plan: free
    region: singapore
