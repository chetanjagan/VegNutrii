{% extends "base.html" %}
{% set public_layout = true %}
{% block title %}Choose a new password{% endblock %}
{% block public %}
<section class="panel auth-card">
  <h1>Choose a new password</h1>
  <form method="post" style="margin-top:1rem">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" required minlength="8"><span class="hint">At least 8 characters.</span></div>
    <button class="btn btn-primary btn-block" type="submit">Save new password</button>
  </form>
</section>
{% endblock %}
