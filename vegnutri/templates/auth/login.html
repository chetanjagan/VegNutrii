{% extends "base.html" %}
{% set public_layout = true %}
{% block title %}Log in{% endblock %}
{% block public %}
<section class="panel auth-card">
  <h1>Welcome back</h1>
  <p class="muted" style="margin:.35rem 0 1.25rem">Log in to see today's plan.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required value="{{ email }}"></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary btn-block" type="submit">Log in</button>
  </form>
  <p style="margin-top:1rem" class="row between"><a href="{{ url_for('auth.forgot') }}">Forgot password?</a><a href="{{ url_for('auth.register') }}">Create an account</a></p>
</section>
{% endblock %}
