{% macro meal_card(m) -%}
<a class="panel meal-card" href="{{ url_for('explore.meal', key=m.key) }}">
  <strong>{{ m.name }}</strong>
  <span class="muted">{{ m.kcal|num }} kcal · {{ m.protein|num }} g protein · {{ m.mins }} min</span>
  <span class="row" style="gap:.3rem">{% for d in meal_diets(m)[:3] %}<span class="tag leaf">{{ d }}</span>{% endfor %}</span>
</a>
{%- endmacro %}
