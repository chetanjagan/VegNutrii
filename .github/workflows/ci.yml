name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Check migrations match the models
        env:
          SECRET_KEY: ci
          DATABASE_URL: sqlite:////tmp/ci.db
          FLASK_APP: wsgi.py
        run: |
          flask db upgrade
          flask db check
