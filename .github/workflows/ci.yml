name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
      - name: Check migrations match the models
        env:
          SECRET_KEY: ci
          DATABASE_URL: sqlite:////tmp/ci.db
          FLASK_APP: wsgi.py
        run: |
          flask db upgrade
          flask db check

  test-postgres:
    # Same suite against Postgres, which is what Render runs in production
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vegnutri_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vegnutri_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run tests on Postgres
        run: pytest -q
      - name: Migrations apply cleanly on Postgres
        env:
          SECRET_KEY: ci
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vegnutri_test
          FLASK_APP: wsgi.py
        run: |
          flask db upgrade
          flask db check
